[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lbrain-coding-agents"
version = "0.1.0"
description = "Install LBrain into coding agents: native MCP, companion skill, fail-closed session start."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
authors = [{ name = "Metavolve Labs, Inc." }]
keywords = ["lbrain", "mcp", "agent-memory", "claude-code", "codex", "grok"]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://lbrain.ai"
Source = "https://github.com/metavolve-labs/lbrain-coding-agents"
Issues = "https://github.com/metavolve-labs/lbrain-coding-agents/issues"

[project.scripts]
lbrain-agents = "lbrain_agents.cli:main"

[tool.setuptools.packages.find]
include = ["lbrain_agents*"]

[tool.setuptools.package-data]
lbrain_agents = ["share/**/*"]

[tool.setuptools]
include-package-data = true
